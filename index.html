<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Vision AI 검사 콘솔 — 시안 B</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d8568'/%3E%3Cpath d='M8 11h4l4 11 4-11h4' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="frame">
  <aside class="rail" aria-label="사이드 메뉴">
    <a class="brand" href="?"><span class="brand-mark">VA</span><span class="brand-name">VISION AI<small>검사 콘솔</small></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="q">회차 검색</label>
        <input id="q" type="search" placeholder="회차 · 시각 · 읽은 값 검색" autocomplete="off" spellcheck="false">
        <button type="submit" class="search-go" aria-label="검색">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>
      <div class="topbar-right">
        <div class="tb-sn" id="tb-sn"></div>
        <div class="user"><span class="avatar" aria-hidden="true">검</span><span class="user-name">검사자<small>Line 3 · 주간</small></span></div>
      </div>
    </header>
    <div class="crumb" id="crumb"></div>
    <main class="page" id="app"></main>
  </div>
</div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="dlg-body"><h2 id="confirm-title"></h2><p id="confirm-desc"></p></div>
  <div class="dlg-actions"><button type="button" class="btn" data-dlg="cancel"></button><button type="button" class="btn" data-dlg="ok"></button></div>
</dialog>
<dialog id="fail-dialog" class="wide" aria-labelledby="fail-title"><div id="fail-body"></div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="proto" id="proto">
  <b>시안 B</b><span>감지값·판정·업로드는 시뮬레이션입니다.</span>
  <div class="right"><label for="screen-select">화면 미리보기</label><select id="screen-select"></select><button type="button" class="btn" id="btn-reset">처음부터</button></div>
</div>
<script src="app.js"></script>
</body>
</html>
